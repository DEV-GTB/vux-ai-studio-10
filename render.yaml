services:
  - type: web
    name: vux-ai-studio
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: NEXUS_DEVICE_TOKEN
        sync: false
      - key: NEXUS_DEVICE_ID
        value: NEXUS-001
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image-preview
      - key: APP_ACCESS_CODE
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "40"
